name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcups2-dev libcupsimage2-dev

      - name: Build
        run: make

      - name: Offline smoke test
        run: make test

      - name: Full test suite (golden hashes, v1/v2/v3 equivalence, hostile corpus under sanitizers)
        run: tests/run_tests.sh
